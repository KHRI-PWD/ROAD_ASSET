<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road Asset Data | Kerala Highway Research Institute</title><link rel="stylesheet" href="resources/ol.css"><link rel="stylesheet" href="resources/khri-ui.css"></head>
<body>
<header><div class="brand">KHRI</div><div><h1>Kerala Highway Research Institute</h1><p>Road Asset Data</p></div><span class="pwd">Kerala PWD</span></header>
<main id="map" aria-label="Interactive road asset map"></main>
<div class="tools" aria-label="Map tools"><button id="fit-map">Full extent</button><button id="locate">My location</button><button id="measure" aria-pressed="false">Measure</button></div>
<div id="notice" role="status">Loading road data… The IRI layer loads separately when selected.</div>
<aside class="legend" aria-label="Layer controls and symbology"><button id="legend-title" aria-expanded="true" aria-controls="legend-body">Layers &amp; legend <span>▾</span></button><div id="legend-body"><div id="layer-list"></div><label class="base"><input id="toggle-base" type="checkbox" checked> Google Road basemap</label><label class="base"><input id="toggle-satellite" type="checkbox"> Google Satellite basemap</label><label class="base"><input id="toggle-hybrid" type="checkbox"> Google Satellite Hybrid basemap</label></div></aside>
<aside id="attributes" hidden aria-label="Feature attributes"><div class="attribute-top"><div><h2>Feature details</h2><p id="selected-count"></p></div><button id="close-attributes" aria-label="Close feature details">×</button></div><div id="attribute-body"></div></aside>
<script>window.addEventListener('error',function(e){var n=document.getElementById('notice');if(n){n.classList.add('error');n.textContent='Unable to load map: '+(e.message||(e.target&&e.target.src)||'missing file')+'. Extract the full ZIP and keep its folders together.';}},true);</script>
<script src="resources/ol.js"></script><script src="resources/khri-manifest.js"></script><script src="resources/khri-app.js"></script>
</body></html>
